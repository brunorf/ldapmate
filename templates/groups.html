{{ define "content" }}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-secondary">Painel de Grupos</h3>
    <a href="/groups/add" class="btn btn-primary rounded-pill shadow px-4">
        <i class="bi bi-plus-lg"></i> Novo Grupo
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>GID</th>
                    <th>Grupo</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {{ range .Data.Groups }}
                <tr>
                    <td><span class="badge bg-secondary">{{ .GID }}</span></td>
                    <td class="fw-bold text-primary">{{ .CN }}</td>
                    <td class="text-muted">{{ .Desc }}</td>
                    <td>
                        <a href="/groups/edit/{{ .CN }}" class="btn btn-sm btn-outline-primary me-1" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="/groups/delete/{{ .CN }}" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Atenção! Apagar grupo?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
