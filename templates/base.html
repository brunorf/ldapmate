<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNESP Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/materia/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* Pequeno ajuste para ficar mais parecido com App */
        .navbar {
            box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
        }

        .card {
            border: none;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 1px 2px rgba(0, 0, 0, .24);
        }

        .btn {
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/users">UNESP LDAP</a>

            {{ if .Session.Values.auth_pass }}
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/users">Usuários</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/groups">Grupos</a>
                    </li>
                </ul>
                <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
            {{ end }}
        </div>
    </nav>

    <div class="container mt-4">
        {{ range .Flashes }}
        <div class="alert alert-info alert-dismissible fade show">
            {{ . }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {{ end }}
        {{ template "content" . }}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
